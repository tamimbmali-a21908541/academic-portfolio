name: cil_app
description: "CIL - Comunidade Islâmica de Lisboa - Official Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # Routing
  go_router: ^13.0.0

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  percent_indicator: ^4.2.3
  carousel_slider: ^4.2.1

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  timezone: ^0.9.2

  # Islamic Features
  hijri: ^3.0.0
  adhan: ^2.0.0

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # WebView for embedded content
  webview_flutter: ^4.4.4

  # XML parsing for RSS feeds
  xml: ^6.5.0

  # Share functionality
  share_plus: ^7.2.1

  # Forms
  flutter_form_builder: ^9.4.1
  form_builder_validators: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true
  # generate: true  # Disabled - using manual localizations in lib/l10n/app_localizations.dart

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
